{% extends "base.html" %}

{% block title %}Error {{ code }} | SecureApp{% endblock %}

{% block content %}

<div class="error-page">

    <div class="large-error">
        {{ code }}
    </div>

    <h1>Access Restricted</h1>

    <p>
        {{ message }}
    </p>

    <a href="{{ url_for('home') }}"
       class="primary-btn error-btn">
        Return to SecureApp
    </a>

</div>

{% endblock %}
